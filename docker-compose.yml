name: netdata

services:
  netdata:
    image: netdata/netdata:stable
    restart: unless-stopped
    hostname: apps
    pid: host
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    expose:
      - '19999'
    environment:
      - NETDATA_CLAIM_TOKEN=${NETDATA_CLAIM_TOKEN:-}
      - NETDATA_CLAIM_URL=${NETDATA_CLAIM_URL:-https://app.netdata.cloud}
      - NETDATA_CLAIM_ROOMS=${NETDATA_CLAIM_ROOMS:-}
      - DOCKER_HOST=/var/run/docker.sock
      - NETDATA_HOST_PREFIX=/host
    volumes:
      - /mnt/app-data/netdata/config:/etc/netdata
      - /mnt/app-data/netdata/lib:/var/lib/netdata
      - /mnt/app-data/netdata/cache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /run/dbus:/run/dbus:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://localhost:19999/api/v1/info']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
